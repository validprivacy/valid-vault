name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Install Chromium for the tests
        run: npx playwright install --with-deps chromium
      - name: Check the phone bundle matches the source
        run: |
          node build.js
          git diff --exit-code -- www/index.html
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Run the tests
        run: npm test
